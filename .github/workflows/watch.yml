
name: Tennis court watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: tennis-court-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check tennis courts
        run: python watcher.py

      - name: Create notification issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          data = json.loads(
              Path("data/latest.json").read_text(encoding="utf-8")
          )

          if not data.get("success", False):
              print("Check incomplete; no vacancy notification.")
              raise SystemExit(0)

          slots = data.get("new_or_reopened", [])

          if not slots:
              print("No new vacancies; no issue created.")
              raise SystemExit(0)

          message = data.get("notification", "").strip()

          if not message:
              print("Notification text missing.")
              raise SystemExit(1)

          title = f"🎾 テニスコート新規空き {len(slots)}件"

          subprocess.run(
              [
                  "gh", "issue", "create",
                  "--repo", os.environ["GH_REPO"],
                  "--title", title,
                  "--body", message,
                  "--assignee", "kobadaitennis-art",
              ],
              check=True,
          )
          PY

      - name: Save latest state
        if: success()
        run: |
          git config user.name "tennis-court-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json
          git diff --cached --quiet || git commit -m "Update court availability state"
          git push

      - name: Upload latest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-check
          path: data/latest.json
