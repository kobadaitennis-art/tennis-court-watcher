name: Tennis court watcher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only validation (no notification or state update)"
        type: boolean
        default: false
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: tennis-court-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Test parsing and notification state
        run: python -m unittest discover -s tests -v

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Diagnose public reservation pages
        if: env.DRY_RUN == 'true'
        run: |
          python -u - <<'PY'
          import asyncio
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from playwright.async_api import async_playwright
          from watcher import (
              URLS,
              open_katsushika,
              month_status,
              target_dates,
          )

          async def diagnose():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)

                  for city in ("urayasu", "katsushika"):
                      context = await browser.new_context(
                          locale="ja-JP",
                          timezone_id="Asia/Tokyo",
                      )
                      page = await context.new_page()
                      page.set_default_timeout(15000)

                      try:
                          print(f"\n=== {city} ===")

                          response = await page.goto(
                              URLS[city],
                              wait_until="domcontentloaded",
                              timeout=60000,
                          )

                          print(
                              "HTTP:",
                              response.status if response else None,
                          )
                          print("TITLE:", await page.title())
                          print(
                              "BODY:",
                              (
                                  await page.locator("body").inner_text()
                              )[:18000],
                          )

                          links = await page.locator("a").evaluate_all(
                              """es => es.map(e => ({
                                  text: e.innerText,
                                  href: e.getAttribute('href'),
                                  alt: e.querySelector('img')?.alt
                              }))"""
                          )
                          print(
                              "LINKS:",
                              json.dumps(links, ensure_ascii=False),
                          )

                          if city == "katsushika":
                              await open_katsushika(page)

                              print(
                                  "MONTH:",
                                  await page.locator(
                                      "table.m_akitablelist"
                                  ).inner_text(),
                              )

                              today = datetime.now(
                                  ZoneInfo("Asia/Tokyo")
                              ).date()
                              dates = target_dates(today, 7)

                              if dates:
                                  print(
                                      "TARGET DATE:",
                                      dates[0].isoformat(),
                                  )
                                  print(
                                      "TARGET DAY:",
                                      await month_status(page, dates[0]),
                                  )

                              calendar_links = await page.locator(
                                  'a[href*="selectDay"]'
                              ).evaluate_all(
                                  """es => es.map(e => ({
                                      text: e.innerText,
                                      href: e.getAttribute('href'),
                                      alt: e.querySelector('img')?.alt
                                  }))"""
                              )
                              print(
                                  "CALENDAR LINKS:",
                                  json.dumps(
                                      calendar_links,
                                      ensure_ascii=False,
                                  ),
                              )

                      except Exception as exc:
                          print(
                              "ERROR:",
                              type(exc).__name__,
                              str(exc),
                          )

                      finally:
                          await context.close()

                  await browser.close()

          asyncio.run(diagnose())
          PY

      - name: Check tennis courts
        run: python watcher.py

      - name: Create vacancy notification and acknowledge state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python notify.py

      - name: Save latest state
        if: success() && env.DRY_RUN != 'true'
        run: |
          git config user.name "tennis-court-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json
          git diff --cached --quiet || git commit -m "Update court availability state"
          git pull --rebase origin main
          git push

      - name: Publish coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("data/latest.json")
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
              with open(
                  os.environ["GITHUB_STEP_SUMMARY"],
                  "a",
                  encoding="utf-8",
              ) as out:
                  out.write(
                      f"## Checked at {data.get('checked_at')}\n"
                  )
                  out.write(
                      "Confirmed facility/date scopes: "
                      f"{len(data.get('coverage', []))}\n\n"
                  )
                  out.write(
                      f"Available: {data.get('available_count')} / "
                      f"new: {data.get('new_or_reopened_count')}\n\n"
                  )
                  for error in data.get("errors", []):
                      out.write(f"- Incomplete: {error}\n")
          PY

      - name: Upload latest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-check
          path: |
            data/latest.json
            data/pending-state.json
          retention-days: 7
          
