name: Tennis court watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check tennis courts
        run: python watcher.py

      - name: Save latest state
        run: |
          git config user.name "tennis-court-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json
          git diff --cached --quiet || git commit -m "Update court availability state"
          git push

      - name: Upload latest result
        uses: actions/upload-artifact@v4
        with:
          name: latest-check
          path: data/latest.json
